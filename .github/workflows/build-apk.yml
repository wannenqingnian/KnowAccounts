name: Build and Release Smart Ledger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install Android build components
        shell: bash
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "sdkmanager was not found under $ANDROID_HOME." >&2
            exit 1
          fi
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --no-pub

      - name: Verify diagnostics and location regressions
        run: |
          flutter test --no-pub --concurrency=1 test/automation_diagnostics_test.dart
          flutter test --no-pub --concurrency=1 test/detailed_diagnostics_test.dart
          flutter test --no-pub test/transaction_location_test.dart
          flutter test --no-pub test/ocr_manual_test.dart

      - name: Verify transaction and discount regressions
        shell: bash
        run: |
          for test_file in payment_automation payment_confirmation payment_worker payment_quality discount_migration backup advanced_finance transaction_identity; do
            flutter test --no-pub --concurrency=1 "test/${test_file}_test.dart"
          done

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret $name is missing." >&2
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smart-ledger-development.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/smart-ledger-development.keystore" >> "$GITHUB_ENV"

      - name: Build ARM64 release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify Android diagnostic privacy policy
        working-directory: android
        run: bash ./gradlew -Pkotlin.incremental=false :app:testDebugUnitTest --tests com.smartledger.smart_ledger.PaymentTracePolicyTest.accessibilityReceiptProducesUsefulMaskedDiagnosticFields --tests com.smartledger.smart_ledger.PaymentTracePolicyTest.recognizedFieldsAreAllowlistedAndMasked --tests com.smartledger.smart_ledger.PaymentTracePolicyTest.detailedPaymentFieldsRequireConsentAndAreScrubbedWhenDisabled

      - name: Verify release JNI libraries
        run: python3 tool/verify_ocr_jni_apk.py build/app/outputs/flutter-apk/app-release.apk

      - name: Verify automation components
        run: |
          python3 tool/verify_automation_apk.py build/app/outputs/flutter-apk/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Name APK and create checksum
        id: package
        shell: bash
        run: |
          version="$(awk '/^version:/{split($2, value, "+"); print value[1]}' pubspec.yaml)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v${version}." >&2
            exit 1
          fi
          apk_name="smart-ledger-${version}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${apk_name}"
          cd build/app/outputs/flutter-apk
          sha256sum "${apk_name}" > "${apk_name}.sha256"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-ledger-${{ github.ref_name }}-arm64-apk
          path: |
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Ledger ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}.sha256
