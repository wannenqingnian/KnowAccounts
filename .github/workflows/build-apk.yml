name: Build and Release Smart Ledger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install Android build components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify release JNI libraries
        run: python3 tool/verify_ocr_jni_apk.py build/app/outputs/flutter-apk/app-release.apk

      - name: Verify automation components
        run: |
          python3 tool/verify_automation_apk.py build/app/outputs/flutter-apk/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Name APK and create checksum
        id: package
        shell: bash
        run: |
          version="$(awk '/^version:/{split($2, value, "+"); print value[1]}' pubspec.yaml)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v${version}." >&2
            exit 1
          fi
          apk_name="smart-ledger-${version}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${apk_name}"
          cd build/app/outputs/flutter-apk
          sha256sum "${apk_name}" > "${apk_name}.sha256"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-ledger-${{ github.ref_name }}-arm64-apk
          path: |
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Smart Ledger ${{ github.ref_name }}（测试版）
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}
            build/app/outputs/flutter-apk/${{ steps.package.outputs.apk_name }}.sha256
